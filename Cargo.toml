[package]
name = "pxd"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
ciborium = "0.2"
base64 = "0.22"
hex = "0.4"
openssl = "0.10"
qrcode = { version = "0.14", default-features = false }
